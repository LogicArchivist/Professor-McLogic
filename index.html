const ds=document.createElement('style');
ds.textContent=`h1,h2{color:${D.tp};}p,span,div{color:inherit;}p{color:${D.ts};font-size:0.88rem;line-height:1.75;margin-bottom:0.75rem;}.info-box{background:${D.bs};border-radius:12px;padding:1.25rem;margin-bottom:1rem;border:0.5px solid ${D.bd};color:${D.ts};}.card{background:${D.bs};border-radius:12px;padding:1rem 1.25rem;margin-bottom:0.75rem;border:0.5px solid ${D.bd};}.diff-card{border-radius:12px;padding:1rem 1.25rem;border:0.5px solid ${D.bd};cursor:pointer;margin-bottom:0.75rem;background:${D.bs};transition:border-color 0.15s;}.diff-card:hover{border-color:${D.accent};}.sc-card{border-radius:12px;padding:1rem 1.25rem;border:0.5px solid ${D.bd};cursor:pointer;margin-bottom:0.6rem;display:flex;justify-content:space-between;align-items:center;background:${D.bs};transition:border-color 0.15s;}.sc-card:hover{border-color:${D.accent};}.elim-wrap{margin-top:8px;padding-top:8px;border-top:0.5px solid ${D.bd};display:none;}.stats-table{width:100%;border-collapse:collapse;margin-bottom:1rem;font-size:0.82rem;}.stats-table th{text-align:left;color:${D.tt};font-weight:400;padding:4px 8px;border-bottom:0.5px solid ${D.bd};}.stats-table td{padding:4px 8px;color:${D.tp};}.stats-table tr:nth-child(even) td{background:rgba(42,58,90,0.3);}.tm{width:100%;border-collapse:collapse;font-size:0.82rem;margin-top:0.5rem;}.tm th,.tm td{padding:6px 10px;border:0.5px solid ${D.bd};text-align:center;color:${D.tp};}.tm th{background:${D.bp};font-weight:600;}.bc-lnk{cursor:pointer;color:${D.ts};text-decoration:underline;}.bc-lnk:hover{color:${D.tp};}.diff-title{font-size:0.95rem;font-weight:600;margin-bottom:4px;color:${D.tp};}.diff-sub{font-size:0.75rem;color:${D.tt};}.sc-title{font-size:1rem;font-weight:600;color:${D.tp};}.sc-sub{font-size:0.75rem;color:${D.tt};margin-top:2px;}select{font-family:Georgia,serif;font-size:0.82rem;padding:4px 8px;border-radius:8px;border:0.5px solid ${D.bm};background:${D.bp};color:${D.tp};cursor:pointer;}select:disabled{opacity:0.5;pointer-events:none;}.result-item{display:flex;gap:8px;align-items:center;font-size:0.82rem;margin-top:5px;color:${D.ts};}.chk{width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;color:#fff;}.chk.ok{background:${D.green};}.chk.no{background:${D.red};}.feedback{padding:12px 16px;border-radius:8px;font-size:0.88rem;margin-bottom:0.75rem;}.feedback.correct{background:${D.greenBg};color:${D.green};}.feedback.incorrect{background:${D.redBg};color:#e07070;}.feedback.warn{background:${D.warnBg};color:${D.warnT};}.feedback.info{background:${D.info};color:${D.infoT};}.stmt{font-size:0.82rem;color:${D.ts};display:flex;gap:6px;margin-bottom:4px;border-radius:4px;padding:2px 4px;align-items:baseline;}.sn{color:${D.tt};min-width:18px;cursor:pointer;user-select:none;font-size:0.75rem;text-decoration:underline dotted;text-underline-offset:2px;}.char-name{font-size:0.95rem;font-weight:600;margin-bottom:6px;color:${D.tp};}.sel-lbl{font-size:0.75rem;color:${D.tt};}`;

const SC={gc:{id:'gc',title:'Gunhold City',short:'Identify immortal residents before they bankrupt the plaque budget.',hasField:false,isTC:false,isMS:false,isLP:false,names:['Adelaide','Bennet','Blake','Boris','Bryce','Cal','Carlton','Caroline','Charlotte','Colridge','David','Delia','Drew','Elizabeth','Fergus','Grace','Ian','James','Jared','Jason','Jeannine','Kavik','Krandal','Kye','Lauren','Liam','Lily','Linda','Lisa','Lloyd','Lucienne','Marcel','Meghan','Michelle','Naomi','Neils','Pearson','Regan','Salvador','Samantha','Skye','Slade','Spike','Taylor','Trent','Troy','Wendy','Wernier','Wesley','Yvonne','Zoe','Alden','Cassie','Derek','Evelyn','Fletcher','Gwen','Harrison','Iris','Julian','Kelsey','Logan','Morgan','Nathan','Olivia','Preston','Quinn','Reid','Stella','Trevor','Uma','Vivian','Wade','York','Zelda'],clearTitle:'Scenario Complete!',clearFlavor:`<p>At last, the immortal beings have discovered that they do not have to hide their true forms, and it's darn expensive when they do! In gratitude, the city has commissioned a special commemorative plaque just for you, taking money from next year's police budget to fund it.</p><p><strong>Professor McLogic, you are awesome!</strong></p>`,infoPages:[{title:'The Mission',html:IB(`<p style="color:${C.ts};">The city of Gunhold is such a cool place that scores of immortal beings have disguised themselves as humans and taken up residence there. Unfortunately, the city has an ordinance allowing any person over 75 to receive a commemorative plaque on his or her birthday, courtesy of the city council. Officials fear that a bunch of immortals could easily run up a multi-billion dollar deficit in commemorative plaques. The city has hired you, Professor McLogic, to determine which citizens are immortal such that they can be encouraged to restrict themselves to a reasonable number of commemorative plaques.</p>`)},{title:'The Classes',html:IB(`<p style="color:${C.ts};">There are 3 classes of individuals you will meet in Gunhold. It is impossible to distinguish between them on the basis of appearance, but their behavior falls into a set of strict categories:</p><p style="color:${C.ts};"><strong>Faeries</strong> are angelic creatures whose statements are always true.</p><p style="color:${C.ts};"><strong>Vampires</strong> are villainous creatures whose statements are always false.</p><p style="color:${C.ts};"><strong>Mortals</strong> are torn between the two extremes, so their statements will alternate between true and false, but not necessarily in that order.</p>`)},{title:'Example',html:IB(`<p style="font-weight:500;margin-bottom:8px;color:${C.tp};">Lily:</p><div style="margin-bottom:10px;"><div class="stmt"><span class="sn">1.</span><span>"My favorite color is fuchsia."</span></div><div class="stmt"><span class="sn">2.</span><span>"My favorite food is doughnuts."</span></div><div class="stmt"><span class="sn">3.</span><span>"My favorite number is eight."</span></div></div><p style="font-weight:500;margin-bottom:6px;color:${C.tp};">If Lily is a...</p><div style="display:flex;gap:8px;margin-bottom:5px;"><span style="font-weight:500;min-width:70px;font-size:13px;color:${C.tp};">Faerie:</span><span style="font-size:13px;color:${C.ts};">All three statements are true; she likes all three items.</span></div><div style="display:flex;gap:8px;margin-bottom:5px;"><span style="font-weight:500;min-width:70px;font-size:13px;color:${C.tp};">Vampire:</span><span style="font-size:13px;color:${C.ts};">All three statements are lies; she hates all three items.</span></div><div style="display:flex;gap:8px;"><span style="font-weight:500;min-width:70px;font-size:13px;color:${C.tp};">Mortal:</span><span style="font-size:13px;color:${C.ts};">The statements alternate between truth and falsehood; Lily either likes fuchsia, hates doughnuts, and likes the number eight, or she hates fuchsia, likes doughnuts, and hates the number eight.</span></div>`)},{title:'Submitting',html:IB(`<p style="color:${C.ts};">When you have determined the class of each person in the area, submit your answer and move on to the next area.</p><p style="color:${C.ts};">Once you have successfully scoured enough areas, your example will inspire the rest of the citizens to come forward on their own and the mission will be complete.</p>`)}],types:['faerie','vampire','mortal-tf','mortal-ft'],typeLabels:{'faerie':'Faerie','vampire':'Vampire','mortal-tf':'Mortal','mortal-ft':'Mortal'},elimKeys:['faerie','vampire','mortal'],elimShort:{'faerie':'Fae','vampire':'Vam','mortal':'Mor'},selectLabel:'Class',selectOpts:`<option value="">-- select --</option><option value="faerie">Faerie</option><option value="vampire">Vampire</option><option value="mortal">Mortal</option>`,checkOk:(sub,sol,nm)=>(sub[nm]==='mortal'&&(sol[nm]==='mortal-tf'||sol[nm]==='mortal-ft'))||(sub[nm]===sol[nm]),displayVal:v=>v==='faerie'?'Faerie':v==='vampire'?'Vampire':'Mortal',hintVal:t=>t==='mortal-tf'||t==='mortal-ft'?'mortal':t,isTruth(sol,nm,idx){const t=sol[nm];return t==='faerie'?true:t==='vampire'?false:t==='mortal-tf'?idx%2===0:idx%2===1;},buildCands(sp,names){const c=[];

ed to the point at which the infected animals start to show physical symptoms, and let's hope it never does, as long as proper preventative measures are taken.</p><p style="color:${C.ts};">Unfortunately, without physical symptoms to go by, most experts have no way to tell which animals are infected, aside from just walking up and asking them.</p><p style="color:${C.ts};">But we all know wild animals can not always be trusted to be truthful...</p>`)},{title:'Truth & Lies',html:IB(`<p style="color:${C.ts};">Whether an animal tells the truth or not is determined not only by its constitution, but also its gender. This is a summary of how the two properties combine to determine an animal's truthfulness:</p><table class="tm"><tr><th></th><th>Male</th><th>Female</th></tr><tr><td style="color:${C.tp};"><strong>Clean</strong></td><td class="t">Truth</td><td class="l">Lie</td></tr><tr><td style="color:${C.tp};"><strong>Rabid</strong></td><td class="l">Lie</td><td class="t">Truth</td></tr></table><p style="margin-top:0.75rem;color:${C.ts};">Neither property is physically apparent and they must be determined from the statements made by the animals.</p>`)},{title:'Example',html:IB(`<p style="font-weight:500;margin-bottom:8px;color:${C.tp};">Mister Ed: "I'm a horse, of course."</p><p style="font-weight:500;margin-bottom:6px;color:${C.tp};">If Mister Ed is a...</p><div style="display:flex;gap:8px;margin-bottom:5px;"><span style="font-weight:500;font-size:13px;min-width:110px;color:${C.tp};">Clean male:</span><span style="font-size:13px;color:${C.ts};">The statement is true; Mister Ed is a horse, of course.</span></div><div style="display:flex;gap:8px;margin-bottom:5px;"><span style="font-weight:500;font-size:13px;min-width:110px;color:${C.tp};">Clean female:</span><span style="font-size:13px;color:${C.ts};">The statement is false; Mister Ed is not a horse.</span></div><div style="display:flex;gap:8px;margin-bottom:5px;"><span style="font-weight:500;font-size:13px;min-width:110px;color:${C.tp};">Rabid male:</span><span style="font-size:13px;color:${C.ts};">The statement is false.</span></div><div style="display:flex;gap:8px;"><span style="font-weight:500;font-size:13px;min-width:110px;color:${C.tp};">Rabid female:</span><span style="font-size:13px;color:${C.ts};">The statement is true. Of course.</span></div>`)},{title:'Submitting',html:IB(`<p style="color:${C.ts};">Once you have determined the gender and constitution of each animal in the area, submit your answer and move on to the next area. After you have successfully cleared enough areas, the epidemic will be sufficiently contained.</p><p style="color:${C.ts};">However, you don't have much time before the animals start becoming violent, turning Mercy Ravine into a hellish, Tennyson-esque nightmare!</p>`)}],types:['clean-male','clean-female','rabid-male','rabid-female'],typeLabels:{'clean-male':'Clean Male','clean-female':'Clean Female','rabid-male':'Rabid Male','rabid-female':'Rabid Female'},elimKeys:['clean-male','clean-female','rabid-male','rabid-female'],elimShort:{'clean-male':'CM','clean-female':'CF','rabid-male':'RM','rabid-female':'RF'},selectLabel:'Type',selectOpts:`<option value="">-- select --</option><option value="clean-male">Clean Male</option><option value="clean-female">Clean Female</option><option value="rabid-male">Rabid Male</option><option value="rabid-female">Rabid Female</option>`,checkOk:(sub,sol,nm)=>sub[nm]===sol[nm],displayVal:v=>({'clean-male':'Clean Male','clean-female':'Clean Female','rabid-male':'Rabid Male','rabid-female':'Rabid Female'}[v]||v),hintVal:t=>t,isTruth(sol,nm){return sol[nm]==='clean-male'||sol[nm]==='rabid-female';},buildCands(sp,names){const c=[];

ily mean the "then" clause is FALSE. It means the entire statement can simply be dismissed; the "then" clause could be true OR false.</p>`)},{title:'Example',html:IB(`<p style="font-weight:500;margin-bottom:8px;color:${C.tp};">Rogers: "If I drink lots of milk, I will be healthy."</p><div style="display:flex;gap:8px;margin-bottom:5px;"><span style="color:${C.ts};">&#8226;</span><span style="font-size:13px;color:${C.ts};">If Rogers drinks lots of milk, he will be healthy.</span></div><div style="display:flex;gap:8px;"><span style="color:${C.ts};">&#8226;</span><span style="font-size:13px;color:${C.ts};">If Rogers does not drink lots of milk, he may or may not be healthy. We can't conclude anything from this statement.</span></div>`)},{title:'Submitting',html:IB(`<p style="color:${C.ts};">Submit your answer once you have determined the rank of every character in the area to move on.</p><p style="color:${C.ts};">But hurry; an academic discipline is only as strong as its personnel, and philosophy is not in flying shape today!</p>`)}],types:['master','student'],typeLabels:{'master':'Master','student':'Student'},elimKeys:['master','student'],elimShort:{'master':'Mstr','student':'Std'},selectLabel:'Rank',selectOpts:`<option value="">-- select --</option><option value="master">Master</option><option value="student">Student</option>`,checkOk:(sub,sol,nm)=>sub[nm]===sol[nm],displayVal:v=>v==='master'?'Master':'Student',hintVal:t=>t,isTruth:()=>true,buildCands(sp,names){const c=[];

an the field in the area, the robot's statements will be <strong style="color:#c0392b;">FALSE</strong>.</p>`)},{title:'Example',html:IB(`<p style="font-weight:500;margin-bottom:8px;color:${C.tp};">Robot: "Gates McFadden is one tough cookie."</p><p style="font-weight:500;margin-bottom:6px;color:${C.tp};">If the robot is...</p><div style="display:flex;gap:8px;margin-bottom:5px;"><span style="font-size:13px;min-width:220px;color:${C.ts};"><strong>Positive</strong>, in a <strong>Positive</strong> field:</span><span style="font-size:13px;color:#1e8449;font-weight:500;">TRUE</span></div><div style="display:flex;gap:8px;margin-bottom:5px;"><span style="font-size:13px;min-width:220px;color:${C.ts};"><strong>Negative</strong>, in a <strong>Positive</strong> field:</span><span style="font-size:13px;color:#c0392b;font-weight:500;">FALSE</span></div><div style="display:flex;gap:8px;margin-bottom:5px;"><span style="font-size:13px;min-width:220px;color:${C.ts};"><strong>Positive</strong>, in a <strong>Negative</strong> field:</span><span style="font-size:13px;color:#c0392b;font-weight:500;">FALSE</span></div><div style="display:flex;gap:8px;"><span style="font-size:13px;min-width:220px;color:${C.ts};"><strong>Negative</strong>, in a <strong>Negative</strong> field:</span><span style="font-size:13px;color:#1e8449;font-weight:500;">TRUE</span></div>`)},{title:'Submitting',html:IB(`<p style="color:${C.ts};">You must determine the charge of each robot. Additionally you must input whether the field in the area is positive or negative. Then submit your answer to travel to the next area.</p><p style="color:${C.ts};">After you decrypt enough robots, the crew will have plenty of functional instruments to continue repairs. But hurry, before the damage becomes irreversible!</p>`)}],types:['positive','negative'],typeLabels:{'positive':'Positive','negative':'Negative'},elimKeys:['positive','negative'],elimShort:{'positive':'+','negative':'&#8722;'},selectLabel:'Charge',selectOpts:`<option val Mr. Pompidou','Ms. Steinem','Mr. Trotsky','Mr. Wilberforce','Ms. Wollstonecraft'],clearTitle:'Scenario Complete!',clearFlavor:`<p>You did it!</p><p>How refreshing! Thanks to you, Professor McLogic, our political leaders can finally advance beyond image maintenance and start addressing actual concerns in the world! It may be easy to get a show of enthusiasm from a politician, but impressing the voting public is a much tougher ordeal, and you have done just that. Now, help yourself to the wet bar! You have more than enough brain cells to afford killing a few.</p>`,infoPages:[{title:'The Convention',html:IB(`<p style="color:${C.ts};">Political scientists have just made the unprecedented discovery that corruption in political representatives is a personal quality that does not depend on which party the representative associates with!</p><p style="color:${C.ts};">Armed with this understanding, you, Professor, have been commissioned by the People's Public Coalition to attend this year's Pan-Political Convention in the luxurious Overwatch Hotel and work out, at last, which of our many public officials can be trusted.</p>`)},{title:'The Types',html:IB(`<table class="tm"><tr><th></th><th>Conservative</th><th>Liberal</th></tr><tr><td style="text-align:left;color:${C.tp};"><strong>Honest</strong><br><small style="color:${C.tt};">Always tell the truth</small></td><td style="background:${DARK?'#1a3a2a':'#eafaf1'};color:#1e8449;font-weight:500;">Honest Conservative</td><td style="background:${DARK?'#1a3a2a':'#eafaf1'};color:#1e8449;font-weight:500;">Honest Liberal</td></tr><tr><td style="text-align:left;color:${C.tp};"><strong>Corrupt</strong><br><small style="color:${C.tt};">Always Lies</small></td><td style="background:${DARK?'#3a1a1a':'#fdecea'};color:#c0392b;font-weight:500;">Corrupt Conservative</td><td style="background:${DARK?'#3a1a1a':'#fdecea'};color:#c0392b;font-weight:500;">Corrupt Liberal</td></tr></table><p style="margin-top:0.75rem;color:${C.ts};">Notice that a politician's party association is COMPLETELY IRRELEVANT to the truthfulness of his or her statements.</p><p style="color:${C.ts};">Unfortunately, you'll find that party association is ALL they want to talk about...</p>`)},{title:'Example',html:IB(`<p style="font-weight:500;margin-bottom:8px;color:${C.tp};">Citizen Kane: "I strongly oppose tiered health care!"</p><p style="font-size:13px;margin-bottom:6px;color:${C.ts};">Mr. Kane's actual political affiliation is TOTALLY IRRELEVANT to the veracity of this statement.</p><div style="margin-bottom:6px;"><span style="font-weight:500;font-size:13px;color:${C.tp};">If he is CORRUPT CONSERVATIVE or CORRUPT LIBERAL:</span><div style="padding-left:1rem;color:#c0392b;font-weight:500;font-size:13px;">the statement is FALSE.</div></div><div><span style="font-weight:500;font-size:13px;color:${C.tp};">If he is HONEST CONSERVATIVE or HONEST LIBERAL:</span><div style="padding-left:1rem;color:#1e8449;font-weight:500;font-size:13px;">the statement is TRUE.</div></div>`)},{title:'Submitting',html:IB(`<p style="color:${C.ts};">When you're done, submit your answer to continue to the next area.</p><p style="color:${C.ts};">Beware though, Professor, for politicians are fond of putting words in each other's mouths!</p>`)}],types:['honest-con','honest-lib','corrupt-con','corrupt-lib'],typeLabels:{'honest-con':'Honest Conservative','honest-lib':'Honest Liberal','corrupt-con':'Corrupt Conservative','corrupt-lib':'Corrupt Liberal'},elimKeys:['honest-con','honest-lib','corrupt-con','corrupt-lib'],elimShort:{'honest-con':'HC','honest-lib':'HL','corrupt-con':'CC','corrupt-lib':'CL'},selectLabel:'Type',selectOpts:`<option value="">-- select --</option><option value="honest-con">Honest Conservative</option><option value="honest-lib">Honest Liberal</option><option value="corrupt-con">Corrupt Conservative</option><option value="corrupt-lib">Corrupt Liberal</option>`,checkOk:(sub,sol,nm)=>sub[nm]===sol[nm],displayVal:v=>({'honest-con':'Honest Conservative' ed, Professor, so your logic can put things into perspective for these youngsters.</p>`)},{title:'The Factions',html:IB(`<p style="color:${C.ts};">Each child is allied exclusively with one faction, and while these children are under the mistaken impression that one faction is essentially better than the other, the nature of their faction in fact depends on the players' own sportsmanship.</p><p style="color:${C.ts};">Each faction either always lies or always tell the truth, but it can vary from area to area. In any particular area, any combination is possible — all three factions could lie, all three could be entirely truthful, or some factions may lie while others tell the truth; but in each area, ALL members of each faction have the SAME standard of truthfulness.</p>`)},{title:'Example',html:IB(`<p style="font-weight:500;margin-bottom:8px;color:${C.tp};">DarkBlackShadowDark: "&gt;n00bs i'm leaving"</p><p style="font-size:13px;margin-bottom:6px;color:${C.ts};">If Dark is a Terrans character, and the Terrans are truthful in this area, the statement is true. Otherwise, the statement is false.</p><p style="font-size:13px;margin-bottom:6px;color:${C.ts};">If Dark is a Zerg character, and the Zerg is truthful in this area, the statement is true. Otherwise, the statement is false.</p><p style="font-size:13px;color:${C.ts};">If Dark is a Protoss character, and the Protoss is truthful in this area, the statement is true. Otherwise, the statement is false.</p>`)},{title:'Submitting',html:IB(`<p style="color:${C.ts};">Work out which faction each youngster belongs to, then work out which factions, if any, tell the truth in the local area. Then confirm your answer.</p><p style="color:${C.ts};">Hopefully you'll be done while it's still lights out. Unlike most of these kids, you have other things to do!</p>`)}]:[{title:'These Kids!',html:IB(`<p style="color:${C.ts};">These kids and their computer games! It may be true that interacting with a computer strengthens the mind and refr on in combat is comprehending their bizarre pseudo-mystic spirituality. Fulminating with concepts like chaos, synchronicity, and phantom corporeality, these lifestyles are simply too esoteric for most humans to grasp. In the interest of tolerance and open-mindedness, you, Professor, have been sent in to disambiguate all the blather and open the door for a new, peaceful symbiosis!</p>`)},{title:'Light, Dark & Ubiquitous',html:IB(`<p style="color:${C.ts};">In the School of Philosophy, you encountered characters who spoke in conditional sentences, with "if" and "then" clauses. Recall that even though every statement was true, the statement's CONVERSE (found by switching the "if" and "then" clauses of the statement) was not necessarily true. The dragons of Windwhip Peak also speak in conditional statements, but (depending on the kind of dragon) sometimes only the converse, or both the statement AND the converse, are true:</p><p style="color:${C.ts};"><strong>LIGHT</strong> dragons speak just like the characters you're familiar with: the STATEMENT is always true, and the CONVERSE may or may not be true. (If A then B)</p><p style="color:${C.ts};">For <strong>DARK</strong> dragons, the CONVERSE is always true, and the STATEMENT is not necessarily true. (If B then A)</p><p style="color:${C.ts};">For <strong>UBIQUITOUS</strong> dragons, both the STATEMENTS and the CONVERSE are always true. (If A then B &amp; If B then A)</p>`)},{title:'Example',html:IB(`<p style="font-weight:500;margin-bottom:8px;color:${C.tp};">Trogdor: "If it is Wednesday, I like the colour green."</p><p style="font-weight:500;margin-bottom:6px;color:${C.tp};">If Trogdor is...</p><div style="margin-bottom:8px;"><div style="font-weight:500;font-size:13px;margin-bottom:4px;color:${C.tp};">LIGHT:</div><div style="font-size:13px;padding-left:1rem;color:${C.ts};">If it is Wednesday, he likes the colour green.<br>But if he likes the colour green, it is not necessarily Wednesday.</div></div><div style="margin-bottom:8px;"><div style="font-weight:500;font-size:13px;margin-bottom:4px;color:${C.tp};">DARK:</div><div style="font-size:13px;padding-left:1rem;color:${C.ts};">If he likes the colour green, it is Wednesday.<br>But if it is Wednesday, he does not necessarily like the colour green.</div></div><div><div style="font-weight:500;font-size:13px;margin-bottom:4px;color:${C.tp};">UBIQUITOUS:</div><div style="font-size:13px;padding-left:1rem;color:${C.ts};">If it is Wednesday, he likes the colour green.<br>AND, if he likes the colour green, it is Wednesday.</div></div>`)},{title:'Submitting',html:IB(`<p style="color:${C.ts};">Once you figure out the type of each dragon, submit your answer to check the solution.</p><p style="color:${C.ts};">It would be dreadful for humankind to bear the burden of being militant and closed-minded, on account of not possessing the vocabulary to puzzle out what these dragons are talking about half the time.</p><p style="color:${C.ts};">Onward then, Professor! Feel your circles, energize your power centers, and prove yourself in your most difficult ordeal yet!</p>`)}],types:['light','dark','ubiquitous'],typeLabels:{light:'Light',dark:'Dark',ubiquitous:'Ubiquitous'},elimKeys:['light','dark','ubiquitous'],elimShort:{light:'Lit',dark:'Drk',ubiquitous:'Ubi'},selectLabel:'Type',selectOpts:`<option value="">-- select --</option><option value="light">Light</option><option value="dark">Dark</option><option value="ubiquitous">Ubiquitous</option>`,checkOk:(sub,sol,nm)=>sub[nm]===sol[nm],displayVal:v=>v==='light'?'Light':v==='dark'?'Dark':'Ubiquitous',hintVal:t=>t,isTruth:()=>true,buildCands(sp,names){const c=[];

function allCombosLP(names,mode){const factions=mode==='starcraft'?['terrans','zerg','protoss']:['alliance','horde'];

function tryGenTC(n){const sc=SC.tc;

const names=shuf(sc.names).slice(0,n);

const sol={};for(const nm of names)sol[nm]=sc.types[Math.floor(Math.random()*4)];if(!names.some(nm=>sc.isReliable(sol[nm]))){sol[names[Math.floor(Math.random()*names.length)]]=Math.random()<0.5?'crescent':'gibbous';}const stmts={};for(const nm of names)stmts[nm]=[];

let on=allCombos(names,sc.types).filter(c=>names.some(nm=>sc.isReliable(c[nm])));

const maxS=n===2?2:n+1,minS=n===2?2:n-1;

const tC={},fC={};for(const nm of names){tC[nm]=0;fC[nm]=0;}let att=0;while(on.length>1&&att<2000){att++;

const sp=names[Math.floor(Math.random()*names.length)];if(stmts[sp].length>=maxS)continue;

const isRel=sc.isReliable(sol[sp]);

let prefT=isRel?true:(tC[sp]===0?true:fC[sp]===0?false:Math.random()<0.5);

const cands=shuf(sc.buildCands(sp,names));

let found=false;for(const wT of[prefT,!prefT]){if(found)break;if(isRel&&!wT)continue;for(const cd of cands){if(cd.f(sol)!==wT)continue;if(stmts[sp].some(s=>s.t===cd.t))continue;

const nOn=on.filter(c=>!sc.isReliable(c[sp])||cd.f(c));if(nOn.length<on.length&&nOn.length>=1){stmts[sp].push(cd);on=nOn;if(wT)tC[sp]++;else fC[sp]++;found=true;break;}}}}if(on.length!==1)return null;

const rem=on[0];if(!names.every(nm=>rem[nm]===sol[nm]))return null;for(const nm of names){if(stmts[nm].length<minS)return null;if(!sc.isReliable(sol[nm])&&(tC[nm]===0||fC[nm]===0))return null;}return{names,stmts,sol};}

function tryGenMS(n){const sc=SC.ms;

const names=shuf(sc.names).slice(0,n);

const sol={};for(const nm of names)sol[nm]=sc.types[Math.floor(Math.random()*sc.types.length)];

const stmts={};for(const nm of names)stmts[nm]=[];

let on=allCombos(names,sc.types);

let att=0;while(on.length>1&&att<800){att++;

const si=stmts[sp].length;

const nOn=on.filter(c=>sc.isTruth(c,sp,si)===cd.f(c));if(nOn.length<on.length&&nOn.length>=1){stmts[sp].push(cd);on=nOn;break;}}}if(on.length!==1)return null;if(names.some(nm=>stmts[nm].length===0))return null;return{names,stmts,sol};}

function tryGenLP(n){const mode=curLPMode;

const sc=SC.lp;

const factions=mode==='starcraft'?['terrans','zerg','protoss']:['alliance','horde'];

const maxS=mode==='starcraft'?3:2;

const names=shuf(sc.names).slice(0,n);

const sol={};for(const f of factions)sol[f]=Math.random()<0.5?'truthful':'lies';for(const nm of names)sol[nm]=factions[Math.floor(Math.random()*factions.length)];

const stmts={};for(const nm of names)stmts[nm]=[];

let att=0;while(on.length>1&&att<1200){att++;

const want=sc.isTruth(sol,sp);

const cands=shuf(sc.buildCands(sp,names));for(const cd of cands){if(cd.f(sol)!==want)continue;if(stmts[sp].some(s=>s.t===cd.t))continue;

const newPat=on.map(c=>cd.f(c));if(stmts[sp].some(ex=>{const ep=on.map(c=>ex.f(c));return newPat.every((v,i)=>v===ep[i]);}))continue;

function tryGen(scId,n){if(SC[scId].isTC)return tryGenTC(n);if(SC[scId].isMS)return tryGenMS(n);if(SC[scId].isLP)return tryGenLP(n);

const sc=SC[scId];

const names=shuf(sc.names).slice(0,n);

const sol={};if(sc.hasField){sol.field=Math.random()<0.5?'positive':'negative';for(const nm of names)sol[nm]=sc.types[Math.floor(Math.random()*sc.types.length)];}else{for(const nm of names)sol[nm]=sc.types[Math.floor(Math.random()*sc.types.length)];}const stmts={};for(const nm of names)stmts[nm]=[];

let on=sc.hasField?allCombosMUZ(names):allCombos(names,sc.types);

const maxS=scId==='sop'||scId==='wp'?3:scId==='mr'?4:scId==='oh'?2:scId==='ps'?2:3;

const psGT={};

const psHR={};if(scId==='ps'){for(const nm of names){psGT[nm]=new Set();psHR[nm]=false;}}let att=0;while(on.length>1&&att<800){att++;

const sp=names[Math.floor(Math.random()*names.length)];if(stmts[sp].length>=maxS)continue;

const si=stmts[sp].length;

const cands=shuf(sc.buildCands(sp,names,si));for(const cd of cands){if(scId==='ps'){if(cd.stype==='guild'&&psGT[sp].has(cd.target))continue;if(cd.stype==='rel'&&psHR[sp])continue;}const want=cd.wantFn?cd.wantFn(sol):sc.isTruth(sol,sp,si);if(cd.f(sol)!==want)continue;if(stmts[sp].some(s=>s.t===cd.t))continue;

const nOn=on.filter(c=>{const w=cd.wantFn?cd.wantFn(c):sc.isTruth(c,sp,si);return cd.f(c)===w;});if(nOn.length<on.length&&nOn.length>=1){stmts[sp].push(cd);on=nOn;if(scId==='ps'){if(cd.stype==='guild')psGT[sp].add(cd.target);else if(cd.stype==='rel')psHR[sp]=true;}break;}}}if(on.length!==1)return null;if(names.some(nm=>stmts[nm].length===0))return null;return{names,stmts,sol};}

const conv=s.conv||s.t;return`<div class="stmt" id="st-${prefix}-${sid}-${i}"><span class="sn sm0" id="mark-${prefix}-${sid}-${i}" onclick="cycleMark('${sid}',${i})" title="Click to mark T/F">·</span><span style="color:${C.tt};min-width:16px;font-size:12px;">${i+1}.</span><span data-pfxsid="${prefix}-${sid}" data-orig="${esc(orig)}" data-conv="${esc(conv)}">"${orig}"</span></div>`;}).join('');

const eb=sc.elimKeys.map(k=>`<button style="${ebS(0)}" onclick="cycleElim('${sid}','${k}')">${sc.elimShort[k]}</button>`).join('');

const hb=allowHint?`<button ${hB} onclick="useHint('${nm.replace(/'/g,"\\'")}','${prefix}')">Hint</button>`:'';

const convBtn=isWP?`<button id="convbtn-${prefix}-${sid}" style="font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid ${C.bd};background:${C.bs};color:${C.tt};cursor:pointer;" onclick="toggleConv('${sid}')">Converse &#8594;</button>`:'';return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px;"><span id="charname-${prefix}-${sid}" class="char-name">${nm}</span><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">${convBtn}${hb}<span class="sel-lbl">${sc.selectLabel}:</span><select id="${prefix}-sel-${sid}">${sc.selectOpts}</select></div></div><div>${ss}</div><div class="elim-wrap" id="ew-${prefix}-${sid}" style="display:none;"><div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;" id="er-${prefix}-${sid}">${eb}<button style="${erS()}" onclick="resetSoft('${sid}')">&#8635;</button></div></div></div>`;}).join('');
const copyBtn=`<button id="cpybtn-${prefix}" style="font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid ${C.bd};background:${C.bs};color:${C.tt};cursor:pointer;margin-bottom:6px;" onclick="copyPuzzle('${prefix}')">&#128203; Copy puzzle</button>`;
const tfN=`<div style="font-size:11px;color:${C.tt};margin-bottom:4px;">· Click the dot before each statement to mark it T/F</div>`;
const ckpt=`<div class="ckpt-bar"><button ${pB()} onclick="saveCheckpoint()">&#128204; Save checkpoint</button><button style="font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid ${C.bd};background:${C.bs};color:${C.tp};cursor:pointer;opacity:0.4;" id="ckpt-restore-${prefix}" disabled onclick="restoreCheckpoint()">&#8617; Restore</button><span id="ckpt-lbl-${prefix}" style="font-size:12px;color:${C.tt};"></span></div>`;
return pre+chars+copyBtn+tfN+`<button style="font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid ${C.bd};background:${C.bs};color:${C.tp};cursor:pointer;margin-bottom:0.5rem;" id="elim-tog-${prefix}" onclick="toggleElim()">Show elimination helper</button>`+ckpt+'<div style="height:8px;"></div>';}

function highlightBad(names,sub,stmts,prefix){document.querySelectorAll('.stmt.bad').forEach(el=>el.classList.remove('bad'));

const sc=SC[curSC];for(const nm of names){if(!sub[nm])continue;

const sid=sId(nm);sc.getContradictions(nm,sub,stmts).forEach(idx=>{const el=document.getElementById(`st-${prefix}-${sid}-${idx}`);if(el)el.classList.add('bad');});}}

function clearHL(){document.querySelectorAll('.stmt.bad').forEach(el=>el.classList.remove('bad'));}

function useHint(nm,prefix){const sol=prefix==='p'?pSol:aSol;

const sc=SC[curSC];

const sel=document.getElementById(`${prefix}-sel-${sId(nm)}`);if(sel){sel.value=sc.hintVal(sol[nm]);sel.disabled=true;}if(prefix==='p')markHint();}

function useFieldHint(prefix){const sol=prefix==='p'?pSol:aSol;

const sel=document.getElementById(`${prefix}-sel-field`);if(sel){sel.value=sol.field;sel.disabled=true;}if(prefix==='p')markHint();}

function useFactHint(faction,prefix){const sol=prefix==='p'?pSol:aSol;

const el=document.getElementById(`${prefix}-faction-${faction}`);if(el){el.value=sol[faction];el.disabled=true;}if(prefix==='p')markHint();}

function markHint(){pHint=true;if(!document.getElementById('hbadge')){const b=document.createElement('span');b.id='hbadge';b.className='hbadge';b.textContent='Hint used — puzzle not counted';

const fb=document.getElementById('p-fb');if(fb)fb.parentNode.insertBefore(b,fb);}}

function getSub(names,prefix){const sc=SC[curSC];

const sub={};if(sc.isLP){const f=curLPMode==='starcraft'?['terrans','zerg','protoss']:['alliance','horde'];for(const x of f){const el=document.getElementById(`${prefix}-faction-${x}`);if(!el||!el.value)return null;sub[x]=el.value;}}if(sc.hasField){const fs=document.getElementById(`${prefix}-sel-field`);if(!fs||!fs.value)return null;sub.field=fs.value;}for(const nm of names){const s=document.getElementById(`${prefix}-sel-${sId(nm)}`);if(!s||!s.value)return null;sub[nm]=s.value;}return sub;}

function disableSels(names,prefix){const sc=SC[curSC];if(sc.isLP){const f=curLPMode==='starcraft'?['terrans','zerg','protoss']:['alliance','horde'];for(const x of f){const el=document.getElementById(`${prefix}-faction-${x}`);if(el)el.disabled=true;}}if(sc.hasField){const fs=document.getElementById(`${prefix}-sel-field`);if(fs)fs.disabled=true;}names.forEach(nm=>{const s=document.getElementById(`${prefix}-sel-${sId(nm)}`);if(s)s.disabled=true;});}

function enableSels(names,prefix){const sc=SC[curSC];if(sc.isLP){const f=curLPMode==='starcraft'?['terrans','zerg','protoss']:['alliance','horde'];for(const x of f){const el=document.getElementById(`${prefix}-faction-${x}`);if(el)el.disabled=false;}}if(sc.hasField){const fs=document.getElementById(`${prefix}-sel-field`);if(fs&&!fs.dataset.hinted)fs.disabled=false;}names.forEach(nm=>{const s=document.getElementById(`${prefix}-sel-${sId(nm)}`);if(s&&!s.dataset.hinted)s.disabled=false;});}

function chkAll(names,sol,sub,sc){let allOk=true;

const items=[];if(sc.isLP){const f=curLPMode==='starcraft'?['terrans','zerg','protoss']:['alliance','horde'];for(const x of f){const ok=sub[x]===sol[x];if(!ok)allOk=false;items.push({nm:x.charAt(0).toUpperCase()+x.slice(1),ok,submitted:sub[x],correct:sol[x],isGlobal:true});}}if(sc.hasField){const ok=sub.field===sol.field;if(!ok)allOk=false;items.push({nm:'Field',ok,submitted:sub.field,correct:sol.field,isGlobal:true});}for(const nm of names){const ok=sc.checkOk(sub,sol,nm);if(!ok)allOk=false;items.push({nm,ok,submitted:sub[nm],correct:sol[nm],isGlobal:false});}return{allOk,items};}

function getCleared(scId){
  const prefixes=scId==='lp'?['lp_standard','lp_starcraft']:[scId];
  const diffs=['classic','advanced','expert'];
  const cleared=new Set();
  try{for(const p of prefixes)for(const d of diffs)if(localStorage.getItem(`${p}_${d}`))cleared.add(d);}catch(e){}
  return cleared.size;
}
function showScenarios(){
  document.getElementById('bc-scenarios').innerHTML=bcH([{label:'Professor McLogic',fn:'showMain()'},{label:'Play',fn:''}]);
  document.getElementById('sc-list').innerHTML=Object.values(SC).map(s=>{
    const n=getCleared(s.id);

    const border=full?'1px solid #4a9eff':'0.5px solid #2a3a5a';
    const shadow=full?'box-shadow:0 0 10px rgba(74,158,255,0.25);':'';
    return`<div class="sc-card" onclick="selectSC('${s.id}')" style="border:${border};${shadow}"><div><div class="sc-title">${s.title}</div><div class="sc-sub">${s.short}</div></div><div style="display:flex;align-items:center;gap:10px;">${n>0?`<div style="display:flex;gap:4px;">${circles}</div>`:''}<div style="font-size:1.2rem;color:#4a9eff;">›</div></div></div>`;
  }).join('');
  applyBtn('sc-back',sBcss(),'Back',showMain);
  showScr('scenarios');
}

const last=pts.pop();pts.push({label:last.label,fn:'showSMenu()'});pts.push({label:'Practice',fn:''});document.getElementById('bc-prac').innerHTML=bcH(pts);

function genPrac(){pAns=false;pHint=false;pTried=false;clearHL();document.getElementById('prac-puzzle').innerHTML=`<div style="font-size:13px;color:${C.tt};padding:2rem;text-align:center;">Generating puzzle...</div>`;setTimeout(()=>{let r=null,t=0;while(!r&&t<200){r=tryGen(curSC,pMode);t++;}if(!r){document.getElementById('prac-puzzle').innerHTML=`<div style="font-size:13px;color:${C.tt};padding:2rem;text-align:center;">Could not generate. <button ${sB()} onclick="genPrac()">Retry</button></div>`;return;}pSol=r.sol;pNames=r.names;pStmts=r.stmts;document.getElementById('prac-puzzle').innerHTML=renderPuz(r.names,r.stmts,'p',true)+'<div class="feedback" id="p-fb" style="display:none;"></div>'+`<div id="p-btns" style="display:flex;gap:8px;flex-wrap:wrap;"><button ${pB()} onclick="subPrac()">Submit</button><button ${sB()} onclick="genPrac()">New puzzle</button></div>`;},30);}

function subPrac(){if(pAns)return;

const sc=SC[curSC];

const fb=document.getElementById('p-fb');

const sub=getSub(pNames,'p');if(!sub){fb.className='feedback warn';fb.style.display='block';fb.innerHTML='Please select all values before submitting.';return;}if(sc.isTC&&!pNames.some(nm=>sc.isReliable(sub[nm]))){fb.className='feedback warn';fb.style.display='block';fb.innerHTML='At least one character must be in a reliable phase (Crescent or Gibbous).';return;}const{allOk,items}=chkAll(pNames,pSol,sub,sc);if(allOk){pAns=true;clearHL();disableSels(pNames,'p');if(!pHint&&!pTried){pStats[pMode].c++;renderPStats();}const fb2=document.getElementById('p-fb');fb2.className='feedback correct';fb2.style.display='block';fb2.innerHTML=(pHint||pTried?'Correct! (not counted)':'Correct!')+items.map(({nm,submitted})=>`<div class="result-item"><span class="chk ok">&#10003;</span><span>${nm}: ${sc.displayVal(submitted)}</span></div>`).join('')+`<div style="margin-top:8px;"><button ${pB()} onclick="genPrac()">Next</button></div>`;document.getElementById('p-btns').style.display='none';}else{if(!pHint&&!pTried){pStats[pMode].w++;renderPStats();}pTried=true;highlightBad(pNames,sub,pStmts,'p');enableSels(pNames,'p');

const fb2=document.getElementById('p-fb');fb2.className='feedback incorrect';fb2.style.display='block';

const wi=items.filter(i=>!i.ok);

const gcNote=(curSC==='gc'||curSC==='ms')&&wi.every(i=>sub[i.nm]==='mortal')?`<div style="margin-top:6px;font-size:12px;opacity:0.8;">Note: these characters are not Mortal.</div>`:'';fb2.innerHTML='Not quite. Highlighted statements contradict your answer.'+wi.map(({nm,submitted})=>`<div class="result-item"><span class="chk no">&#10007;</span><span>${nm}: ${sc.displayVal(submitted)}</span></div>`).join('')+gcNote+`<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;"><button ${pB()} onclick="tryAgainP()">Try again</button><button ${sB()} onclick="revealP()">Reveal answer</button><button ${sB()} onclick="genPrac()">New puzzle</button></div>`;document.getElementById('p-btns').style.display='none';}}

function tryAgainP(){clearHL();enableSels(pNames,'p');document.getElementById('p-fb').style.display='none';document.getElementById('p-btns').style.display='flex';}

function revealP(){const sc=SC[curSC];clearHL();if(sc.isLP){const f=curLPMode==='starcraft'?['terrans','zerg','protoss']:['alliance','horde'];for(const x of f){const el=document.getElementById(`p-faction-${x}`);if(el){el.value=pSol[x];el.disabled=true;}}}if(sc.hasField){const fs=document.getElementById('p-sel-field');if(fs){fs.value=pSol.field;fs.disabled=true;}}pNames.forEach(nm=>{const s=document.getElementById(`p-sel-${sId(nm)}`);if(s){s.value=sc.hintVal(pSol[nm]);s.disabled=true;}});

const fb=document.getElementById('p-fb');fb.className='feedback info';fb.style.display='block';

const rev=pNames.map(nm=>`<div class="result-item"><span class="chk ok">&#10003;</span><span>${nm}: ${sc.typeLabels[pSol[nm]]}</span></div>`).join('');fb.innerHTML='Answer revealed.'+rev+`<div style="margin-top:8px;"><button ${sB()} onclick="genPrac()">New puzzle</button></div>`;document.getElementById('p-btns').style.display='none';}

const el=document.getElementById('act-timer');if(el)el.textContent=fmtT(aSecs);},1000);

let rec='';try{const r=localStorage.getItem(`${lsKey()}_${diffId}`);if(r)rec=`<span class="rbadge">Best: ${fmtT(parseInt(r))}</span>`;}catch(e){}document.getElementById('act-rec').innerHTML=rec;applyBtn('act-quit',dBcss(),'Quit',confirmLeave);showScr('active');genActPuz();}

function genActPuz(){aAns=false;clearHL();updProg();

const n=aDiff.struct[aIdx];document.getElementById('act-puzzle').innerHTML=`<div style="font-size:13px;color:${C.tt};padding:2rem;text-align:center;">Generating puzzle...</div>`;setTimeout(()=>{let r=null,t=0;while(!r&&t<200){r=tryGen(curSC,n);t++;}if(!r){document.getElementById('act-puzzle').innerHTML=`<div style="font-size:13px;color:${C.tt};padding:2rem;text-align:center;">Could not generate. <button ${sB()} onclick="genActPuz()">Retry</button></div>`;return;}aSol=r.sol;aNames=r.names;aStmts=r.stmts;document.getElementById('act-puzzle').innerHTML=`<div style="font-size:13px;color:${C.tt};margin-bottom:0.75rem;">Area ${aIdx+1} of ${aDiff.struct.length} &#8212; ${n} characters</div>`+renderPuz(r.names,r.stmts,'a',false)+'<div class="feedback" id="a-fb" style="display:none;"></div>'+`<div id="a-btns"><button ${pB()} onclick="subAct()">Submit</button></div>`;},30);}

function subAct(){if(aAns)return;

const sc=SC[curSC];

const fb=document.getElementById('a-fb');

const sub=getSub(aNames,'a');if(!sub){fb.className='feedback warn';fb.style.display='block';fb.innerHTML='Please select all values before submitting.';return;}if(sc.isTC&&!aNames.some(nm=>sc.isReliable(sub[nm]))){fb.className='feedback warn';fb.style.display='block';fb.innerHTML='At least one character must be in a reliable phase (Crescent or Gibbous).';return;}const{allOk,items}=chkAll(aNames,aSol,sub,sc);aAns=true;if(allOk){aRes[aIdx]=true;aIdx++;disableSels(aNames,'a');fb.className='feedback correct';fb.style.display='block';

const rHTML=items.map(({nm,submitted})=>`<div class="result-item"><span class="chk ok">&#10003;</span><span>${nm}: ${sc.displayVal(submitted)}</span></div>`).join('');if(aIdx>=aDiff.struct.length){stopTmr();fb.innerHTML='Correct!'+rHTML+`<div style="margin-top:8px;"><button ${pB()} onclick="finishActive()">Complete!</button></div>`;}else{fb.innerHTML='Correct!'+rHTML+`<div style="margin-top:8px;"><button ${pB()} onclick="genActPuz()">Next area</button></div>`;}}else{aRes[aIdx]=false;highlightBad(aNames,sub,aStmts,'a');disableSels(aNames,'a');fb.className='feedback incorrect';fb.style.display='block';

const wHTML=items.filter(i=>!i.ok).map(({nm,submitted,correct})=>`<div class="result-item"><span class="chk no">&#10007;</span><span>${nm}: ${sc.displayVal(submitted)} (correct: ${sc.displayVal(correct)})</span></div>`).join('');

const okHTML=items.filter(i=>i.ok).map(({nm,submitted})=>`<div class="result-item"><span class="chk ok">&#10003;</span><span>${nm}: ${sc.displayVal(submitted)}</span></div>`).join('');fb.innerHTML='Not quite. Highlighted statements contradict your answer.'+wHTML+okHTML+`<div style="margin-top:8px;"><button ${pB()} onclick="genActPuz()">Try new puzzle for this area</button></div>`;}updProg();}

function finishActive(){const sc=SC[curSC];document.getElementById('clr-title').textContent=sc.clearTitle;document.getElementById('clr-title').style.color=C.tp;document.getElementById('clr-flavor').innerHTML=sc.clearFlavor;document.getElementById('clr-hr').style.borderTop=`0.5px solid ${C.bd}`;document.getElementById('clr-stats').textContent=`Difficulty: ${aDiff.label} — Time: ${fmtT(aSecs)}`;document.getElementById('clr-stats').style.color=C.tt;

let recMsg='';try{const key=`${lsKey()}_${aDiff.id}`;

const prev=localStorage.getItem(key);if(!prev||aSecs<parseInt(prev)){localStorage.setItem(key,aSecs);recMsg=prev?`New best! Previous: ${fmtT(parseInt(prev))}`:'First completion recorded!';}else recMsg=`Best time: ${fmtT(parseInt(prev))}`;}catch(e){}document.getElementById('clr-rec').textContent=recMsg;document.getElementById('clr-rec').style.color=C.tp;document.getElementById('clr-btns').innerHTML=`<button ${pB()} onclick="replayActive()">Play again</button><button ${sB()} onclick="showDiff()">Change difficulty</button><button ${sB()} onclick="showSMenu()">Scenario menu</button><button ${sB()} onclick="showMain()">Main menu</button>`;showScr('clear');}

function showModal(title,body,okLabel,onOk){document.getElementById('modal-title').textContent=title;document.getElementById('modal-title').style.color=C.tp;document.getElementById('modal-body').textContent=body;document.getElementById('modal-body').style.color=C.ts;document.getElementById('modal-box').style.cssText=`border-radius:12px;padding:1.5rem;max-width:300px;width:90%;background:${C.bp};border:0.5px solid ${C.bd};`;applyBtn('modal-ok',dBcss(),okLabel,()=>{closeModal();onOk();});applyBtn('modal-cancel',sBcss(),'Cancel',closeModal);document.getElementById('modal').style.display='flex';}

function confirmLeave(){showModal('Quit scenario?','Your progress and time will be lost.','Quit',()=>{stopTmr();showSMenu();});}
showMain();
</script>
